[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyknow"
version = "3.3.1"
description = "抖音收藏 → 转录 → 本地 Markdown 知识库；抖音、小红书、知乎、B站、微博热榜和高赞内容找选题"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "douyin",
    "dyknow",
    "transcription",
    "whisper",
    "faster-whisper",
    "speech-to-text",
    "knowledge-base",
    "obsidian",
    "markdown",
    "ai-agent",
    "llm",
    "playwright",
    "自动化",
    "抖音",
    "知识库",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/stank2386322761/dyknow"
Repository = "https://github.com/stank2386322761/dyknow"
Changelog = "https://github.com/stank2386322761/dyknow/blob/master/CHANGELOG.md"
Issues = "https://github.com/stank2386322761/dyknow/issues"
dependencies = [
    "playwright>=1.45",
    "requests>=2.28",
    "faster-whisper>=1.1.0",
    # PyAV 19 去掉了 faster-whisper 1.2.1 还在传的 metadata_errors 参数，转录全部报 TypeError
    "av>=11,<19",
    "zhconv>=1.4",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Windows / Linux 上让 NVIDIA 显卡可用所需的运行库
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]

[project.scripts]
dyknow = "dyknow.cli:main"

[tool.setuptools.packages.find]
include = ["dyknow*"]

[tool.setuptools.package-data]
dyknow = ["templates/*.md"]
