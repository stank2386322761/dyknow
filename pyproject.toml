[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyknow"
version = "3.1.0"
description = "抖音收藏 / 链接 / 搜索 / 博主作品 → 转录 → 本地 Markdown 知识库，AI 按模板整理"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "requests>=2.28",
    "faster-whisper>=1.1.0",
    "zhconv>=1.4",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Windows / Linux 上让 NVIDIA 显卡可用所需的运行库
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]

[project.scripts]
dyknow = "dyknow.cli:main"

[tool.setuptools.packages.find]
include = ["dyknow*"]

[tool.setuptools.package-data]
dyknow = ["templates/*.md"]
